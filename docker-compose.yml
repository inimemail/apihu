services:
  api-dz:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-dz:latest
    container_name: api-dz
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      SUB2API_ADMIN_PASSWORD_FILE: /app/.secrets/admin-password
    ports:
      - "0.0.0.0:${PORT:-32874}:${PORT:-32874}"
    volumes:
      - ./.deploy/admin-password:/app/.secrets/admin-password:ro
      - model-catalog-cache:/app/.cache

volumes:
  model-catalog-cache:
